name: Build LakoDOOM for Linux

on:
  push:
    branches: [master, main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              cmake \
              pkg-config \
              libsdl2-dev \
              libsdl2-mixer-dev \
              libsdl2-net-dev \
              libpng-dev \
              fluidsynth \
              libfluidsynth-dev  

      - name: Configure DOOM
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile DOOM
        run: |
          cmake --build build --parallel 2

      - name: Verify Linux executable
        run: |
          file build/src/chocolate-doom
          ldd build/src/chocolate-doom

      - name: Package executable
        run: |
          mkdir -p package/engine
          cp build/src/chocolate-doom package/engine/
          chmod +x package/engine/chocolate-doom

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: LakoDOOM-Linux-AMD64
          path: package/